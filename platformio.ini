; ============================================================================
;  xteinkos — X3 OSINT OS
;  PlatformIO build configuration for the Xteink X3 (ESP32-C3, 792x528 e-ink)
; ============================================================================
;
;  Build:   pio run
;  Upload:  pio run -t upload
;  Filesys: pio run -t buildfs && pio run -t uploadfs   (uploads /data to LittleFS)
;  Monitor: pio device monitor
;
;  NOTE: SD, WiFi, WebServer, LittleFS, HTTPClient and DNSServer are all part of
;  the ESP32 Arduino framework and MUST NOT be listed under lib_deps — doing so
;  makes the dependency finder look for external libraries of those names and
;  breaks resolution. Only genuinely-external libraries belong below.

[platformio]
default_envs = x3

[env:x3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

; Use LittleFS for the config + logs partition (SPIFFS is deprecated).
board_build.filesystem = littlefs

; The Xteink X3 has 16 MB flash. Use a CrossPoint-compatible partition layout
; (dual 6.25 MB app slots + 3.375 MB LittleFS "spiffs") so images built here
; line up with the device and the CrossPoint web flasher. app0 starts at
; 0x10000; LittleFS mounts the "spiffs"-labelled partition (at 0xc90000).
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000
board_build.partitions = partitions.csv

lib_deps =
    bblanchon/ArduinoJson @ ^7.4.2
    ricmoo/QRCode @ ^0.0.1
    zinggjm/GxEPD2 @ ^1.6.4
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.16.1

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
    -DDEVICE_X3
    -DDISPLAY_WIDTH=792
    -DDISPLAY_HEIGHT=528
    -std=gnu++2a

monitor_speed = 115200
upload_speed = 921600
