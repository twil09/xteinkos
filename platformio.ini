; ============================================================================
;  xteinkos — Duet-styled OS for the Xteink X3 (ESP32-C3, 792x528 e-ink)
;  Reader + games + WiFi/QR, on the MIT community-sdk hardware layer.
; ============================================================================
[platformio]
default_envs = x3

[env:x3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

board_build.filesystem = littlefs
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000
board_build.partitions = partitions.csv

; Vendored MIT hardware libs live in lib/ (EInkDisplay, InputManager,
; SDCardManager) and are picked up automatically.
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.16.1
    bblanchon/ArduinoJson @ ^7.4.2
    ricmoo/QRCode @ ^0.0.1
    greiman/SdFat @ ^2.3.1

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
    -DDEVICE_X3
    -std=gnu++2a

monitor_speed = 115200
upload_speed = 921600
