; ============================================================================
;  xteinkos — X3 OSINT OS
;  PlatformIO build configuration for the Xteink X3 (ESP32-C3, 792x528 e-ink)
; ============================================================================
;
;  Build:   pio run
;  Upload:  pio run -t upload
;  Filesys: pio run -t buildfs && pio run -t uploadfs   (uploads /data to LittleFS)
;  Monitor: pio device monitor
;
;  NOTE: SD, WiFi, WebServer, LittleFS, HTTPClient and DNSServer are all part of
;  the ESP32 Arduino framework and MUST NOT be listed under lib_deps — doing so
;  makes the dependency finder look for external libraries of those names and
;  breaks resolution. Only genuinely-external libraries belong below.

[platformio]
default_envs = x3

[env:x3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

; Use LittleFS for the config + web assets partition (SPIFFS is deprecated).
board_build.filesystem = littlefs

; The WiFi + WebServer + GxEPD2 stack is large; the default partition table
; leaves almost no headroom (~99% flash). huge_app gives a 3 MB app partition
; plus a ~900 KB LittleFS "spiffs" partition (assumes 4 MB flash — the common
; ESP32-C3 size; verify for your unit).
board_build.partitions = huge_app.csv

lib_deps =
    bblanchon/ArduinoJson @ ^7.4.2
    ricmoo/QRCode @ ^0.0.1
    zinggjm/GxEPD2 @ ^1.6.4
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.16.1

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
    -DDEVICE_X3
    -DDISPLAY_WIDTH=792
    -DDISPLAY_HEIGHT=528
    -std=gnu++2a

monitor_speed = 115200
upload_speed = 921600
