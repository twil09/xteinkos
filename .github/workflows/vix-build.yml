name: Vix OS build

# Builds the CrossPoint-based Vix OS firmware for the Xteink X3/X4 and uploads
# the flashable image as an artifact. Runs on GitHub's runners, which have the
# full internet access needed for PlatformIO's registry + the Arduino core
# rebuild (which the dev sandbox cannot reach).

on:
  push:
    branches: [claude/vix-crosspoint]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build firmware (X3/X4)
        run: pio run -e default

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: vixos-x3-firmware
          path: |
            .pio/build/default/firmware.bin
            .pio/build/default/bootloader.bin
            .pio/build/default/partitions.bin
          if-no-files-found: error
